# Binding for ouro (https://github.com/iteramen/ouro), the issue-to-PR workflow this repo is
# developed with.
schema = 1

[repo]
slug = "iteramen/byovox"
default_branch = "main"
protected_branch_prefixes = []

[labels]
scope = []
area = []

# The same three checks ci.yml runs.
[[gate]]
run = "cargo fmt --check"

[[gate]]
run = "cargo clippy --all-targets --locked -- -D warnings"

[[gate]]
run = "cargo test --locked"

[ship]
policy = "stop-at-pr"
review = "adversarial-review"
test_first_for_bugs = true

[rolling_issues]
loop_runs = "Loop runs"

[authority]
local = ["SECURITY.md"]

[overlays]
implement = ["SECURITY.md"]
land = []

[owner]
role = "loop owner"
ruling_approvers = ["BoJl4apa"]
