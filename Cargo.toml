[package]
name = "byovox"
version = "0.4.0"
edition = "2024"
# let-chains need 1.88.
rust-version = "1.88"
description = "Push-to-talk dictation against a speech-to-text server you run"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/iteramen/byovox"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "whisper", "push-to-talk", "hotkey"]
categories = ["command-line-utilities", "accessibility", "multimedia::audio"]

# Must match the archive name and flat layout .github/workflows/release.yml builds. Inert until
# the crate is published to crates.io.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/byovox-v{ version }-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

# Declared, not discovered: release.yml and binstall both name exactly these two.
[[bin]]
name = "byovox"
path = "src/main.rs"

[[bin]]
name = "byovox-daemon"
path = "src/bin/byovox-daemon.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.17.3"
directories = "6.0.0"
fontdue = "0.9.4"
hound = "3.5.1"
interprocess = "2.4.3"
muda = "0.19.3"
ring = "0.17.14"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
softbuffer = "0.4.8"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tray-icon = "0.24.2"
ureq = "3.4.0"
winit = "0.30.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  # needed by CreateJobObjectW
  "Win32_Security",
] }
# `windows::core::implement` expands to `::windows_core::…`, which must be a direct dependency.
windows-core = "0.62"
winreg = "0.55"
